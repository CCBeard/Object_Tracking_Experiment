# Baseline: YOLO11n fine-tuned from COCO weights at the default resolution.
name: y11n_640
model: yolo11n.pt      # pretrained COCO checkpoint (auto-downloads if missing)
data: VisDrone.yaml    # Ultralytics built-in; downloads + converts VisDrone on first use

# Passed straight through to model.train(); any Ultralytics train arg is allowed here.
train:
  imgsz: 640
  epochs: 100
  batch: 16            # -1 = auto-pick the largest batch that fits in VRAM
  patience: 30         # early stop if val mAP hasn't improved in this many epochs
  seed: 0
  deterministic: true
  workers: 4
  cache: false         # true = cache decoded images in RAM (faster, ~several GB)
  max_det: 500         # detections kept per image after NMS; VisDrone val has images with 300+ objects
